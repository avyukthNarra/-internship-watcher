name: Tests
on:
  pull_request:
  push:
    paths:
      - '**.py'
      - 'config.json'
      - 'requirements.txt'
      - 'internship-pinger/**'
      - '.github/workflows/test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test internship-pinger/worker.test.js
