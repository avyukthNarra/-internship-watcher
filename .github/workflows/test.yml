name: Tests
on:
  pull_request:
  push:
    paths:
      - '**.py'
      - 'config.json'
      - 'requirements.txt'
      - 'internship-pinger/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test internship-pinger/worker.test.js

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply database schema and RLS checks
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/local_auth_stub.sql
          for migration in supabase/migrations/*.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f "$migration"
          done
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
