name: Internship Watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (best-effort; GitHub may delay)
  workflow_dispatch: {}       # manual trigger button

permissions:
  contents: write             # to commit seen.json back

concurrency:
  group: watcher              # never run two watchers at once (seen.json races)
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_TOP: ${{ secrets.DISCORD_WEBHOOK_URL_TOP }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPLIED_CHANNEL_ID: ${{ secrets.APPLIED_CHANNEL_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          PERSONAL_WEBHOOKS_JSON: ${{ secrets.PERSONAL_WEBHOOKS_JSON }}
        run: python watcher.py

      - name: Persist state
        if: always()
        run: |
          git config user.name "internship-watcher-bot"
          git config user.email "actions@github.com"
          for f in seen.json message_map.json notion_state.json delivery_state.json health.json; do
            git add "$f" 2>/dev/null || true
          done
          git diff --cached --quiet || git commit -m "Update seen postings [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Preserve state for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-state-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            seen.json
            message_map.json
            notion_state.json
            delivery_state.json
            health.json
