name: Internship Watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (best-effort; GitHub may delay)
  workflow_dispatch: {}       # manual trigger button

permissions:
  contents: read              # state lives in the private internship-watcher-state repo
  issues: write               # to open/close "source-down" issues
  actions: write              # to dispatch source-doctor.yml

concurrency:
  group: watcher              # never run two watchers at once (seen.json races)
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    environment: production   # secrets live in the main-only "production" environment
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # All runtime state (seen postings, delivery queue, health, Discord and Notion IDs)
      # lives in the private internship-watcher-state repo, so the bot never pushes here.
      - name: Load private state
        uses: actions/checkout@v7
        with:
          repository: avyukthNarra/internship-watcher-state
          ssh-key: ${{ secrets.STATE_DEPLOY_KEY }}
          path: .state

      - name: Copy private state into place
        id: private_state
        run: cp .state/seen.json .state/delivery_state.json .state/health.json .state/notion_state.json .state/message_map.json .

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        id: watcher
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_TOP: ${{ secrets.DISCORD_WEBHOOK_URL_TOP }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APPLIED_CHANNEL_ID: ${{ secrets.APPLIED_CHANNEL_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          PERSONAL_WEBHOOKS_JSON: ${{ secrets.PERSONAL_WEBHOOKS_JSON }}
        run: python watcher.py

      # Issues opened with GITHUB_TOKEN don't trigger workflows, so dispatch explicitly.
      - name: Dispatch source doctor
        if: always() && vars.SOURCE_DOCTOR_ENABLED == 'true' && steps.watcher.outputs.source_issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for issue in ${{ steps.watcher.outputs.source_issues }}; do
            gh workflow run source-doctor.yml --ref main -f issue="$issue" || true
          done

      # Validated recovery generation (state_snapshot.py, see sai_docs/07). It is kept in
      # the private repo, never uploaded as an artifact: artifacts here are public.
      - name: Capture recovery snapshot
        id: recovery_snapshot
        if: always() && steps.private_state.outcome == 'success'
        run: |
          snapshot_dir="$(python3 state_snapshot.py create --out "$RUNNER_TEMP/watcher-snapshots")"
          echo "path=$snapshot_dir" >> "$GITHUB_OUTPUT"

      - name: Persist private state
        if: always() && steps.private_state.outcome == 'success'
        working-directory: .state
        env:
          SNAPSHOT: ${{ steps.recovery_snapshot.outputs.path }}
        run: |
          cp ../seen.json ../delivery_state.json ../health.json ../notion_state.json ../message_map.json .
          if [ -n "$SNAPSHOT" ]; then
            rm -rf snapshot && cp -R "$SNAPSHOT" snapshot
          fi
          git config user.name "internship-watcher-bot"
          git config user.email "actions@github.com"
          git add -A seen.json delivery_state.json health.json notion_state.json message_map.json snapshot
          git diff --cached --quiet && exit 0
          git commit -m "Update state (run ${{ github.run_id }})"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
